<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bg)"/>
  
  <!-- Shield shape -->
  <path d="M64 20 L100 35 L100 60 C100 85 64 105 64 105 C64 105 28 85 28 60 L28 35 Z" 
        fill="url(#shield)" opacity="0.9"/>
  
  <!-- Eye icon (closed/masked) -->
  <g transform="translate(64, 58)">
    <!-- Eye shape -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="none" stroke="#0d1b2a" stroke-width="3"/>
    <!-- Closed line (masking indicator) -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round"/>
    <!-- Diagonal strike through -->
    <line x1="-16" y1="12" x2="16" y2="-12" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Lock icon at bottom -->
  <g transform="translate(64, 85)">
    <rect x="-8" y="0" width="16" height="12" rx="2" fill="#0d1b2a"/>
    <path d="M-5 0 L-5 -5 C-5 -10 5 -10 5 -5 L5 0" fill="none" stroke="#0d1b2a" stroke-width="2.5"/>
  </g>
  
  <!-- Asterisks representing masked values -->
  <text x="64" y="42" font-family="monospace" font-size="10" fill="#0d1b2a" text-anchor="middle" font-weight="bold">*****</text>
</svg>
